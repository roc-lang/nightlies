on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

name: Nightly release for new compiler

# Do not add permissions here! Configure them at the job level!
permissions: {}

env:
  ZIG_VERSION: 0.16.0
jobs:
  resolve-roc-ref:
    name: Resolve roc commit and date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.green.outputs.sha }}
      sha_full: ${{ steps.green.outputs.sha_full }}
      already_released: ${{ steps.green.outputs.already_released }}
      date: ${{ steps.ref.outputs.date }}
      tag_name_components: ${{ steps.ref.outputs.tag_name_components }}

    steps:
      # Don't build from main's tip: a bypass merge can land a PR whose CI was
      # red, and main is then broken until someone notices. roc's main ruleset
      # requires exactly one status check, `finish` (the aggregate job of roc's
      # ci_manager.yml), so "CI passed" for a commit means `finish` was green on
      # the head of the PR that produced it. Walk main backwards and take the
      # newest merge commit that landed that way.
      #
      # This does not catch every broken main: roc's ruleset sets
      # strict_required_status_checks_policy=false, so a PR can be green against
      # a stale base and still break main once merged. Catching that needs
      # roc's own Nightly Gate (nightly_gate.yml), which runs the full suite on
      # main and fast-forwards refs/heads/nightly on success. Switch the
      # resolution below to that branch once it starts passing.
      - name: Resolve newest green roc-lang/roc commit
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROC_REPO: roc-lang/roc
          # Two API calls per candidate; the walk is normally 1-3 candidates.
          MAX_COMMITS: 50
        run: |
          set -euo pipefail

          # GitHub Actions' app id, matching the integration_id that roc's
          # ruleset pins `finish` to, so an unrelated check of the same name
          # from another app cannot stand in for it.
          ACTIONS_APP_ID=15368

          picked=""
          skipped=0
          checked=0
          page=1
          while [ -z "$picked" ] && [ "$checked" -lt "$MAX_COMMITS" ]; do
            commits=$(gh api "repos/$ROC_REPO/commits?sha=main&per_page=50&page=$page" --jq '.[].sha')
            [ -n "$commits" ] || break

            # Unquoted on purpose: shas are hex, so word splitting is the split.
            for sha in $commits; do
              checked=$((checked + 1))
              [ "$checked" -le "$MAX_COMMITS" ] || break

              # Commits that reached main inside a merge were never main's tip
              # on their own, so only merge commits are release candidates.
              head_sha=$(gh api "repos/$ROC_REPO/commits/$sha/pulls" \
                --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$sha\")][0].head.sha // empty")
              if [ -z "$head_sha" ]; then
                echo "skip ${sha:0:7}: not the merge commit of a merged PR"
                continue
              fi

              verdict=$(gh api "repos/$ROC_REPO/commits/$head_sha/check-runs?check_name=finish&per_page=100" \
                --jq "[.check_runs[] | select(.status == \"completed\" and .app.id == $ACTIONS_APP_ID)][0].conclusion // \"missing\"")
              if [ "$verdict" = "success" ]; then
                echo "pick ${sha:0:7}: finish=success on PR head ${head_sha:0:7}"
                picked="$sha"
                break
              fi

              skipped=$((skipped + 1))
              echo "skip ${sha:0:7}: finish=$verdict on PR head ${head_sha:0:7}"
            done

            page=$((page + 1))
          done

          if [ -z "$picked" ]; then
            echo "::error::No roc-lang/roc main commit in the last $MAX_COMMITS commits landed with a green 'finish' check. Refusing to publish a nightly from a main that has no known-good commit."
            exit 1
          fi

          if [ "$skipped" -gt 0 ]; then
            echo "::warning::Skipped $skipped roc-lang/roc main commit(s) that landed with a red or missing 'finish' check. Building ${picked:0:7} instead of main's tip."
          fi

          short="${picked:0:7}"

          # The tag carries the date, so a repeat of the same commit collides
          # with nothing and would publish silently. That is the common case
          # rather than the rare one: while main sits red the walk above keeps
          # returning the same green commit every day, and the cost is a full
          # 5-OS build plus a 9-OS test matrix for bits we already shipped.
          # Release tags are `nightly-<year>-<month>-<day>-<short sha>`, so the
          # sha suffix is what identifies a rebuild of the same commit.
          already=""
          for tag in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'); do
            case "$tag" in
              *-"$short") already="$tag"; break ;;
            esac
          done

          if [ -n "$already" ]; then
            echo "::notice::roc-lang/roc $short was already published as $already, and nothing newer has landed green on main. Skipping this nightly."
            echo "already_released=true" >> $GITHUB_OUTPUT
          else
            echo "already_released=false" >> $GITHUB_OUTPUT
          fi

          echo "sha=$short" >> $GITHUB_OUTPUT
          echo "sha_full=$picked" >> $GITHUB_OUTPUT

      - name: Resolve date
        id: ref
        run: |
          DATE=$(date "+%Y-%m-%d")
          echo "date=$DATE" >> $GITHUB_OUTPUT
          YEAR=$(echo $DATE | cut -d- -f1)
          MONTH_NUM=$(echo $DATE | cut -d- -f2)
          DAY=$(echo $DATE | cut -d- -f3)
          case $MONTH_NUM in
            01) MONTH="January" ;;
            02) MONTH="February" ;;
            03) MONTH="March" ;;
            04) MONTH="April" ;;
            05) MONTH="May" ;;
            06) MONTH="June" ;;
            07) MONTH="July" ;;
            08) MONTH="August" ;;
            09) MONTH="September" ;;
            10) MONTH="October" ;;
            11) MONTH="November" ;;
            12) MONTH="December" ;;
          esac
          echo "tag_name_components=$YEAR-$MONTH-$DAY" >> $GITHUB_OUTPUT

  build-and-package:
    name: build and package nightly release
    needs: resolve-roc-ref
    # PR runs exist to exercise the build, so they build regardless; only the
    # publishing paths skip. Skipping here cascades: publish-release and
    # test-archives need this job, and neither forces itself to run.
    if: github.event_name == 'pull_request' || needs.resolve-roc-ref.outputs.already_released != 'true'
    runs-on: ${{ matrix.os }}
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      DATE: ${{ needs.resolve-roc-ref.outputs.date }}
      TAG_NAME_COMPONENTS: ${{ needs.resolve-roc-ref.outputs.tag_name_components }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact_name: macos_x86_64
          - os: macos-15
            artifact_name: macos_apple_silicon
          - os: ubuntu-22.04
            artifact_name: linux_x86_64
          - os: ubuntu-24.04-arm
            artifact_name: linux_arm64
          - os: windows-2022
            artifact_name: windows_x86_64
          #- os: windows-11-arm
          #  artifact_name: windows_arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout roc-lang/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      # temp fix, see https://roc.zulipchat.com/#narrow/channel/395097-compiler-development/topic/CI/near/542085291
      - name: delete llvm-config
        if: startsWith(matrix.os, 'ubuntu') && endsWith(matrix.os, '-arm')
        run: |
          sudo rm /usr/lib/llvm-18/bin/llvm-config

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # ratchet:ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}

      - name: Print CPU model (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty Name

      - name: Print CPU model (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu.brand_string || true

      - name: Print CPU model (Linux)
        if: runner.os == 'Linux'
        run: lscpu | grep "Model name"

      - name: build release
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-release'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: check if statically linked (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          file ./roc-src/zig-out/bin/roc | grep "statically linked"

      # The release target is pinned to the aarch64 baseline in roc's build.zig
      # (getReleaseTargetQuery). If that pin is lost, Zig falls back to native CPU
      # detection and bakes this runner's armv9 features into the binary, which then
      # dies with SIGILL on older aarch64 devices (Raspberry Pi 4, many phones).
      # - name: check for non-baseline aarch64 instructions (linux arm64)
      #   if: matrix.artifact_name == 'linux_arm64'
      #   run: |
      #     objdump -d --no-show-raw-insn ./roc-src/zig-out/bin/roc > /tmp/roc-dis.txt

      #     # SVE/SVE2 vector and predicate registers.
      #     SVE_RE='[[:space:]](z[0-9]+\.[bhsdq]|p[0-9]+(\.[bhsd])?/[zm])'
      #     # LSE atomics (armv8.1).
      #     LSE_RE='[[:space:]](cas|casp|swp|ld(add|clr|eor|set|smax|smin|umax|umin))(a|l|al)?(b|h)?([[:space:]]|$)'
      #     # RCPC loads/stores (armv8.3/8.4).
      #     RCPC_RE='[[:space:]](ldapr|ldapur|ldapursw?|stlur)(b|h)?([[:space:]]|$)'

      #     fail=0
      #     for pair in "SVE:$SVE_RE" "LSE atomics:$LSE_RE" "RCPC:$RCPC_RE"; do
      #       name="${pair%%:*}"
      #       re="${pair#*:}"
      #       count=$(grep -cE "$re" /tmp/roc-dis.txt || true)
      #       if [ "$count" -gt 0 ]; then
      #         echo "Found $count $name instructions, which are not in the armv8.0-a baseline. Examples:"
      #         grep -nE "$re" /tmp/roc-dis.txt | head -5 || true
      #         fail=1
      #       else
      #         echo "OK: no $name instructions"
      #       fi
      #     done

      #     if [ "$fail" -ne 0 ]; then
      #       echo "This binary requires a newer CPU than the armv8.0-a baseline, so it will crash"
      #       echo "with SIGILL on older aarch64 devices. Check getReleaseTargetQuery() in roc's build.zig."
      #       exit 1
      #     fi

      - name: check if statically linked (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          otool_out="$(otool -L ./roc-src/zig-out/bin/roc)"
          echo "$otool_out"
          # Roc must only depend on libraries that ship with every macOS install, so it
          # stays trivial to install. FSEvents-based file watching links CoreFoundation
          # and CoreServices (which pull in libobjc); all of these are part of the OS.
          unexpected="$(echo "$otool_out" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/libSystem\.B\.dylib|/usr/lib/libobjc\.A\.dylib|/System/Library/Frameworks/CoreFoundation\.framework/|/System/Library/Frameworks/CoreServices\.framework/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Looks like the nightly build has a new dynamic dependency, we want Roc to be super easy to install, so it should only depend on libraries that ship with macOS."
            echo "Unexpected dependencies:"
            echo "$unexpected"
            exit 1
          fi

      - name: check if statically linked (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          $imports = (Get-Command roc-src\zig-out\bin\roc.exe).FileVersionInfo.ImportCharacterSet
          if ($imports) {
              echo "Looks like the nightly executable has dynamic dependencies. We want Roc to be super easy to install, so it should be statically linked."
              echo "Dynamic dependencies found:"
              $imports | ForEach-Object { echo "  $_" }
              exit 1
          }

      - name: build file name
        run: echo "RELEASE_FOLDER_NAME=roc_nightly-${{ matrix.artifact_name }}-$DATE-$SHA" >> $GITHUB_ENV

      - name: Package release
        run: |
          mkdir -p ${{ env.RELEASE_FOLDER_NAME }}
          cp ./roc-src/zig-out/bin/roc ${{ env.RELEASE_FOLDER_NAME }}/
          cp ./roc-src/LICENSE ./roc-src/legal_details ${{ env.RELEASE_FOLDER_NAME }}/

      - name: Bundle Darwin sysroot (macOS only)
        if: runner.os == 'macOS'
        run: |
          cp -r ./roc-src/src/cli/darwin ${{ env.RELEASE_FOLDER_NAME }}/

      - name: Compress release (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf "${{ env.RELEASE_FOLDER_NAME }}.tar.gz" ${{ env.RELEASE_FOLDER_NAME }}

      - name: Compress release (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip "${{ env.RELEASE_FOLDER_NAME }}.zip" ${{ env.RELEASE_FOLDER_NAME }}

      - name: Calculate archive hash for security purposes (Unix)
        if: runner.os != 'Windows'
        run: sha256sum ${{ env.RELEASE_FOLDER_NAME }}.tar.gz

      - name: Calculate archive hash for security purposes (Windows)
        if: runner.os == 'Windows'
        run: sha256sum ${{ env.RELEASE_FOLDER_NAME }}.zip

      - name: Upload roc nightly archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FOLDER_NAME }}.tar.gz
          path: ${{ env.RELEASE_FOLDER_NAME }}.tar.gz
          retention-days: 4

      - name: Upload roc nightly archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FOLDER_NAME }}.zip
          path: ${{ env.RELEASE_FOLDER_NAME }}.zip
          retention-days: 4

  build-wasm-artifacts:
    name: build playground and roc compiler wasm
    needs: resolve-roc-ref
    if: github.event_name == 'pull_request' || needs.resolve-roc-ref.outputs.already_released != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout roc-lang/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true

      - name: Build playground
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-playground -Doptimize=ReleaseSmall'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload playground.wasm
        uses: actions/upload-artifact@v4
        with:
          name: playground.wasm
          path: roc-src/zig-out/bin/playground.wasm
          retention-days: 4

      - name: Build roc compiler wasm archive
        uses: ./roc-src/.github/actions/flaky-retry
        with:
          command: 'cd roc-src && zig build build-echo-wasm-archive -Doptimize=ReleaseSmall'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload echo.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: echo.wasm.zst
          path: roc-src/zig-out/lib/echo.wasm.zst
          retention-days: 4

  publish-release:
    name: Publish release to GitHub
    if: github.event_name != 'pull_request'
    needs: [resolve-roc-ref, build-and-package, build-wasm-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      TAG_NAME_COMPONENTS: ${{ needs.resolve-roc-ref.outputs.tag_name_components }}

    steps:
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # ratchet:actions/download-artifact@v5.0.0
        with:
          path: ./artifacts

      - name: Create Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly-${{ env.TAG_NAME_COMPONENTS }}-${{ env.SHA }}"
          BODY="Nightly build of new Roc compiler from roc-lang/roc commit [${{ env.SHA }}](https://github.com/roc-lang/roc/commit/${{ env.SHA }}), the most recent commit on main that landed with a passing CI run."

          # Create the release (non-draft, non-prerelease)
          gh release create "$TAG" artifacts/**/* \
            --title "$TAG" \
            --notes "$BODY" \
            --latest=true

  test-archives:
    name: Test nightly release archives
    if: github.event_name != 'pull_request'
    needs: [resolve-roc-ref, publish-release]
    runs-on: ${{ matrix.os }}
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      DATE: ${{ needs.resolve-roc-ref.outputs.date }}
      TAG_NAME_COMPONENTS: ${{ needs.resolve-roc-ref.outputs.tag_name_components }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact_name: macos_x86_64
          - os: macos-15
            artifact_name: macos_apple_silicon
          - os: macos-26-intel
            artifact_name: macos_x86_64
          - os: macos-26
            artifact_name: macos_apple_silicon
          - os: ubuntu-22.04
            artifact_name: linux_x86_64
          - os: ubuntu-26.04
            artifact_name: linux_x86_64
          - os: ubuntu-26.04-arm
            artifact_name: linux_arm64
          - os: windows-2022
            artifact_name: windows_x86_64
          - os: windows-2025
            artifact_name: windows_x86_64
          #- os: windows-11-arm
          #  artifact_name: windows_arm64

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: build file name
        run: echo "RELEASE_FOLDER_NAME=roc_nightly-${{ matrix.artifact_name }}-$DATE-$SHA" >> $GITHUB_ENV

      - name: Download release archive (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.tar.gz" \
            "https://github.com/${{ github.repository }}/releases/download/nightly-${{ env.TAG_NAME_COMPONENTS }}-${{ env.SHA }}/${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Download release archive (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.zip" \
            "https://github.com/${{ github.repository }}/releases/download/nightly-${{ env.TAG_NAME_COMPONENTS }}-${{ env.SHA }}/${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Print CPU model (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty Name

      - name: Print CPU model (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu.brand_string || true

      - name: Print CPU model (Linux)
        if: runner.os == 'Linux'
        run: lscpu | grep "Model name"

      - name: Decompress release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -xzf "${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Decompress release archive (Windows)
        if: runner.os == 'Windows'
        run: |
          7z x "${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Checkout nightlies repo for hello_world_test.roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      - name: Run hello_world_test.roc (Unix)
        if: runner.os != 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc

      - name: Run hello_world_test.roc (Windows)
        if: runner.os == 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc
