on:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if a nightly was already released today (or this commit was already released). The tag still has to be free: re-releasing the same commit on the same day collides with the existing tag and fails."
        type: boolean
        default: false
      roc_ref:
        description: "roc-lang/roc tag, branch or commit to build instead of the newest main commit that landed green. Defaults to release_tag when that is set."
        type: string
        default: ""
      release_tag:
        description: "Publish a versioned release instead of a nightly: this existing roc-lang/roc tag names the release and is reported by `roc version`. The release goes into roc-lang/roc (a prerelease if the tag contains -RC), the ReleaseSafe twin into this repo as <tag>-safe."
        type: string
        default: ""
      publish:
        description: "Publish the release. Unchecked, the run builds and packages everything and leaves the archives as this run's artifacts, for a release made by hand."
        type: boolean
        default: true
  #schedule:
  #  - cron: "0 9 * * *"

name: Nightly release for new compiler

# Do not add permissions here! Configure them at the job level!
permissions: {}

# A manual run and the 9:00 UTC cron can otherwise overlap: the release guard
# in resolve-roc-ref reads published releases, so a run that starts while
# another is still building sees no release yet and happily builds a second
# one. Queueing the newcomer means it resolves after the first has published,
# and the guard then skips it. PRs get their own group so they stay parallel.
concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.1
jobs:
  resolve-roc-ref:
    name: Resolve roc commit and date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.green.outputs.sha }}
      sha_full: ${{ steps.green.outputs.sha_full }}
      already_released: ${{ steps.green.outputs.already_released }}
      date: ${{ steps.green.outputs.date }}
      tag: ${{ steps.ref.outputs.tag }}
      release_repo: ${{ steps.ref.outputs.release_repo }}
      prerelease: ${{ steps.ref.outputs.prerelease }}
      archive_prefix: ${{ steps.ref.outputs.archive_prefix }}
      archive_version: ${{ steps.ref.outputs.archive_version }}

    steps:
      # Don't build from main's tip: a bypass merge can land a PR whose CI was
      # red, and main is then broken until someone notices. roc's main ruleset
      # requires exactly one status check, `finish` (the aggregate job of roc's
      # ci_manager.yml), so "CI passed" for a commit means `finish` was green on
      # the head of the PR that produced it. Walk main backwards and take the
      # newest merge commit that landed that way.
      #
      # This does not catch every broken main: roc's ruleset sets
      # strict_required_status_checks_policy=false, so a PR can be green against
      # a stale base and still break main once merged. Catching that needs
      # roc's own Nightly Gate (nightly_gate.yml), which runs the full suite on
      # main and fast-forwards refs/heads/nightly on success. Switch the
      # resolution below to that branch once it starts passing.
      #
      # A manual run can name the commit instead (roc_ref, or release_tag for a
      # versioned release), and then the walk is skipped.
      - name: Resolve newest green roc-lang/roc commit
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROC_REPO: roc-lang/roc
          # Two API calls per candidate; the walk is normally 1-3 candidates.
          MAX_COMMITS: 50
          FORCE: ${{ inputs.force }}
          ROC_REF: ${{ inputs.roc_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HAS_RELEASE_TOKEN: ${{ secrets.ROC_RELEASE_TOKEN != '' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TAG" ]; then
            # The tag ends up in release names, archive names and a zig build
            # command line, so only plain version-like strings are accepted.
            if ! [[ "$RELEASE_TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
              echo "::error::release_tag '$RELEASE_TAG' must consist of letters, digits, '.', '_' and '-'."
              exit 1
            fi
            # Checked here so a missing token fails in seconds rather than
            # after every platform has been built.
            if [ "$PUBLISH" = "true" ] && [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo "::error::Publishing release_tag into $ROC_REPO needs the ROC_RELEASE_TOKEN secret (a token with Contents: read and write on $ROC_REPO); this workflow's GITHUB_TOKEN can only write to $GITHUB_REPOSITORY."
              exit 1
            fi
            [ -n "$ROC_REF" ] || ROC_REF="$RELEASE_TAG"
          fi

          # GitHub Actions' app id, matching the integration_id that roc's
          # ruleset pins `finish` to, so an unrelated check of the same name
          # from another app cannot stand in for it.
          ACTIONS_APP_ID=15368

          picked=""
          skipped=0
          checked=0
          page=1
          if [ -n "$ROC_REF" ]; then
            if ! [[ "$ROC_REF" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]]; then
              echo "::error::roc_ref '$ROC_REF' is not a valid tag, branch or commit name."
              exit 1
            fi
            picked=$(gh api "repos/$ROC_REPO/commits/$ROC_REF" --jq '.sha')
            echo "pick ${picked:0:7}: roc_ref $ROC_REF"
          fi

          # A release attaches to its existing roc-lang/roc tag, so the binaries
          # have to be built from exactly the commit that tag names.
          if [ -n "$RELEASE_TAG" ]; then
            tag_sha=$(gh api "repos/$ROC_REPO/commits/refs/tags/$RELEASE_TAG" --jq '.sha')
            if [ "$tag_sha" != "$picked" ]; then
              echo "::error::roc_ref $ROC_REF is ${picked:0:7}, but $ROC_REPO tag $RELEASE_TAG is ${tag_sha:0:7}."
              exit 1
            fi
          fi

          while [ -z "$picked" ] && [ "$checked" -lt "$MAX_COMMITS" ]; do
            commits=$(gh api "repos/$ROC_REPO/commits?sha=main&per_page=50&page=$page" --jq '.[].sha')
            [ -n "$commits" ] || break

            # Unquoted on purpose: shas are hex, so word splitting is the split.
            for sha in $commits; do
              checked=$((checked + 1))
              [ "$checked" -le "$MAX_COMMITS" ] || break

              # Commits that reached main inside a merge were never main's tip
              # on their own, so only merge commits are release candidates.
              head_sha=$(gh api "repos/$ROC_REPO/commits/$sha/pulls" \
                --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$sha\")][0].head.sha // empty")
              if [ -z "$head_sha" ]; then
                echo "skip ${sha:0:7}: not the merge commit of a merged PR"
                continue
              fi

              verdict=$(gh api "repos/$ROC_REPO/commits/$head_sha/check-runs?check_name=finish&per_page=100" \
                --jq "[.check_runs[] | select(.status == \"completed\" and .app.id == $ACTIONS_APP_ID)][0].conclusion // \"missing\"")
              if [ "$verdict" = "success" ]; then
                echo "pick ${sha:0:7}: finish=success on PR head ${head_sha:0:7}"
                picked="$sha"
                break
              fi

              skipped=$((skipped + 1))
              echo "skip ${sha:0:7}: finish=$verdict on PR head ${head_sha:0:7}"
            done

            page=$((page + 1))
          done

          if [ -z "$picked" ]; then
            echo "::error::No roc-lang/roc main commit in the last $MAX_COMMITS commits landed with a green 'finish' check. Refusing to publish a nightly from a main that has no known-good commit."
            exit 1
          fi

          if [ "$skipped" -gt 0 ]; then
            echo "::warning::Skipped $skipped roc-lang/roc main commit(s) that landed with a red or missing 'finish' check. Building ${picked:0:7} instead of main's tip."
          fi

          short="${picked:0:7}"

          # Resolved here rather than in a later step so both halves of the
          # guard below and the tag itself agree on one date, even across a
          # midnight boundary. The runner clock is UTC, which is also what the
          # cron schedule above is in.
          DATE=$(date -u "+%Y-%m-%d")

          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$short" >> $GITHUB_OUTPUT
          echo "sha_full=$picked" >> $GITHUB_OUTPUT

          # The guards below are about nightlies: a versioned release is named
          # by its tag rather than by date and commit, and is never a repeat.
          if [ -n "$RELEASE_TAG" ]; then
            echo "already_released=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Two ways an already-published nightly can come round again, both
          # checked against the existing release tags
          # (`nightly-YYYY-MM-DD-<short sha>`):
          #
          # 1. Same commit, any day. The tag carries the date, so a repeat of
          #    the same commit collides with nothing and would publish
          #    silently. That is the common case rather than the rare one:
          #    while main sits red the walk above keeps returning the same
          #    green commit every day, and the cost is a full 5-OS build plus a
          #    9-OS test matrix for bits we already shipped.
          #
          # 2. Same day, any commit. A manual workflow_dispatch releases, then
          #    the cron fires later the same day; if anything green landed in
          #    between, the sha differs and check 1 lets it through. That is
          #    two nightlies for one date, which is exactly what "nightly"
          #    promises not to be.
          # Fetched into a variable rather than inlined into the `for` below:
          # a command substitution that fails there is not caught by `set -e`,
          # so a hiccup listing releases would silently mean zero iterations,
          # no match, and the duplicate release this guard exists to stop.
          # As an assignment, a failure aborts the step instead.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')

          same_sha=""
          same_day=""
          for tag in $tags; do
            # A ReleaseSafe twin is only published after its regular release,
            # so it has nothing to add here.
            case "$tag" in
              *-safe) continue ;;
            esac
            case "$tag" in
              *-"$short") [ -n "$same_sha" ] || same_sha="$tag" ;;
            esac
            case "$tag" in
              nightly-"$DATE"-*) [ -n "$same_day" ] || same_day="$tag" ;;
            esac
            [ -n "$same_sha" ] && [ -n "$same_day" ] && break
          done

          already_released=false
          if [ -n "$same_day" ]; then
            echo "::notice::$same_day was already released today ($DATE). Skipping this nightly; re-run with the 'force' input if a second release today is really wanted."
            already_released=true
          elif [ -n "$same_sha" ]; then
            echo "::notice::roc-lang/roc $short was already published as $same_sha, and nothing newer has landed green on main. Skipping this nightly."
            already_released=true
          fi

          if [ "$already_released" = "true" ] && [ "$FORCE" = "true" ]; then
            echo "::warning::Publishing anyway because the 'force' input was set."
            already_released=false
          fi

          echo "already_released=$already_released" >> $GITHUB_OUTPUT

      - name: Resolve tag
        id: ref
        env:
          SHA: ${{ steps.green.outputs.sha }}
          DATE: ${{ steps.green.outputs.date }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The single source of truth for this release's identity: it names the
          # release, and is baked into the binary via roc's -Dcompiler-version so
          # `roc version` reports the release the user actually downloaded.
          #
          # A nightly is published here, with archives named
          # roc_nightly-<platform>-<date>-<sha>. A versioned release is published
          # into roc-lang/roc on its existing tag, with archives named
          # roc-<platform>-<tag> like roc's earlier releases. Its ReleaseSafe twin
          # stays here, because a `<tag>-safe` release in roc-lang/roc would
          # create a new tag there.
          if [ -n "$RELEASE_TAG" ]; then
            echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
            echo "release_repo=roc-lang/roc" >> $GITHUB_OUTPUT
            case "$RELEASE_TAG" in
              *-RC*) echo "prerelease=true" >> $GITHUB_OUTPUT ;;
              *) echo "prerelease=false" >> $GITHUB_OUTPUT ;;
            esac
            echo "archive_prefix=roc" >> $GITHUB_OUTPUT
            echo "archive_version=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly-$DATE-$SHA" >> $GITHUB_OUTPUT
            echo "release_repo=$GITHUB_REPOSITORY" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "archive_prefix=roc_nightly" >> $GITHUB_OUTPUT
            echo "archive_version=$DATE-$SHA" >> $GITHUB_OUTPUT
          fi

  build-and-package:
    name: build and package nightly release
    needs: resolve-roc-ref
    # PR runs exist to exercise the build, so they build regardless; only the
    # publishing paths skip. publish-release repeats this same guard, because
    # it no longer takes a skipped or failed build here as a reason to skip.
    if: github.event_name == 'pull_request' || needs.resolve-roc-ref.outputs.already_released != 'true'
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_PREFIX: ${{ needs.resolve-roc-ref.outputs.archive_prefix }}
      ARCHIVE_VERSION: ${{ needs.resolve-roc-ref.outputs.archive_version }}
      VARIANT_SUFFIX: ${{ matrix.variant == 'safe' && '-safe' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # To add an OS, list it here and give it an artifact_name below.
        os: [macos-15-intel, macos-15, ubuntu-22.04, ubuntu-24.04-arm, windows-2022]
        # fast is the regular ReleaseFast nightly. safe is ReleaseSafe: Zig's
        # safety checks stay on, so seemingly pure Roc code cannot trick a
        # compiler bug into emitting malicious effectful code; it panics instead.
        # It ships as its own `<tag>-safe` release.
        variant: [fast, safe]
        include:
          - os: macos-15-intel
            artifact_name: macos_x86_64
          - os: macos-15
            artifact_name: macos_apple_silicon
          - os: ubuntu-22.04
            artifact_name: linux_x86_64
          - os: ubuntu-24.04-arm
            artifact_name: linux_arm64
          - os: windows-2022
            artifact_name: windows_x86_64
          #- os: windows-11-arm
          #  artifact_name: windows_arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout roc-lang/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - name: Checkout nightlies repo for hello_world_test.roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      # No Zig cache: setup-zig would save whatever roc's build leaves in
      # .zig-cache to this repo's default-branch cache and restore it into the
      # next nightly, so one bad roc commit could taint nightlies built after it
      # was reverted. The cache bought no speed anyway, as roc changes daily: the
      # first Zig 0.17.1 nightly built cold and took as long as the warm ones.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      # temp fix, see https://roc.zulipchat.com/#narrow/channel/395097-compiler-development/topic/CI/near/542085291
      - name: delete llvm-config
        if: startsWith(matrix.os, 'ubuntu') && endsWith(matrix.os, '-arm')
        run: |
          sudo rm /usr/lib/llvm-18/bin/llvm-config

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # ratchet:ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}

      - name: Print CPU model (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty Name

      - name: Print CPU model (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu.brand_string || true

      - name: Print CPU model (Linux)
        if: runner.os == 'Linux'
        run: lscpu | grep "Model name"

      # -Dcompiler-version is interpolated here rather than read from $TAG at run
      # time: the command runs inside a composite action, so it must not depend on
      # this job's env reaching the action's own steps.
      #
      # build-release is ReleaseFast unless -Doptimize is given. The safe build
      # reports the same version as the regular one: it is the same compiler, so
      # app headers pinned to the tag must work with both.
      #
      # Every flaky-retry in this workflow is roc-lang/roc's pinned to 1bf9043
      # ("ci: stop flaky-retry from matching real failures") rather than the
      # ./roc-src copy: a change to that action in roc cannot alter a nightly run,
      # and no action definition is taken from the checkout of roc in a job that
      # can write this repo's default-branch cache.
      - name: build release
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: "cd roc-src && zig build build-release ${{ matrix.variant == 'safe' && '-Doptimize=ReleaseSafe' || '' }} -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}"
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      # build-release silently ignored -Doptimize before roc-lang/roc#12801, and
      # nothing else would notice a "safe" archive that is really ReleaseFast.
      # The message of Zig's bounds-check panic is only linked in when bounds
      # checks are compiled in.
      - name: check that the safe build has safety checks
        if: matrix.variant == 'safe'
        run: |
          bin=./roc-src/zig-out/bin/roc${{ runner.os == 'Windows' && '.exe' || '' }}
          if ! LC_ALL=C grep -aq 'index out of bounds: index ' "$bin"; then
            echo "$bin has no bounds-check panic message, so it was not built ReleaseSafe."
            exit 1
          fi

      - name: check if statically linked (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          file ./roc-src/zig-out/bin/roc | grep "statically linked"

      # The release target is pinned to the aarch64 baseline in roc's build.zig
      # (getReleaseTargetQuery). If that pin is lost, Zig falls back to native CPU
      # detection and bakes this runner's armv9 features into the binary, which then
      # dies with SIGILL on older aarch64 devices (Raspberry Pi 4, many phones).
      # - name: check for non-baseline aarch64 instructions (linux arm64)
      #   if: matrix.artifact_name == 'linux_arm64'
      #   run: |
      #     objdump -d --no-show-raw-insn ./roc-src/zig-out/bin/roc > /tmp/roc-dis.txt

      #     # SVE/SVE2 vector and predicate registers.
      #     SVE_RE='[[:space:]](z[0-9]+\.[bhsdq]|p[0-9]+(\.[bhsd])?/[zm])'
      #     # LSE atomics (armv8.1).
      #     LSE_RE='[[:space:]](cas|casp|swp|ld(add|clr|eor|set|smax|smin|umax|umin))(a|l|al)?(b|h)?([[:space:]]|$)'
      #     # RCPC loads/stores (armv8.3/8.4).
      #     RCPC_RE='[[:space:]](ldapr|ldapur|ldapursw?|stlur)(b|h)?([[:space:]]|$)'

      #     fail=0
      #     for pair in "SVE:$SVE_RE" "LSE atomics:$LSE_RE" "RCPC:$RCPC_RE"; do
      #       name="${pair%%:*}"
      #       re="${pair#*:}"
      #       count=$(grep -cE "$re" /tmp/roc-dis.txt || true)
      #       if [ "$count" -gt 0 ]; then
      #         echo "Found $count $name instructions, which are not in the armv8.0-a baseline. Examples:"
      #         grep -nE "$re" /tmp/roc-dis.txt | head -5 || true
      #         fail=1
      #       else
      #         echo "OK: no $name instructions"
      #       fi
      #     done

      #     if [ "$fail" -ne 0 ]; then
      #       echo "This binary requires a newer CPU than the armv8.0-a baseline, so it will crash"
      #       echo "with SIGILL on older aarch64 devices. Check getReleaseTargetQuery() in roc's build.zig."
      #       exit 1
      #     fi

      - name: check if statically linked (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          otool_out="$(otool -L ./roc-src/zig-out/bin/roc)"
          echo "$otool_out"
          # Roc must only depend on libraries that ship with every macOS install, so it
          # stays trivial to install. FSEvents-based file watching links CoreFoundation
          # and CoreServices (which pull in libobjc); all of these are part of the OS.
          unexpected="$(echo "$otool_out" | tail -n +2 | grep -vE '^[[:space:]]+(/usr/lib/libSystem\.B\.dylib|/usr/lib/libobjc\.A\.dylib|/System/Library/Frameworks/CoreFoundation\.framework/|/System/Library/Frameworks/CoreServices\.framework/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Looks like the nightly build has a new dynamic dependency, we want Roc to be super easy to install, so it should only depend on libraries that ship with macOS."
            echo "Unexpected dependencies:"
            echo "$unexpected"
            exit 1
          fi

      # Developer ID signing plus notarization is what lets a downloaded roc
      # run without Gatekeeper calling it malware. Notarization requires the
      # hardened runtime, and under it roc's in-process code loading (pages
      # written, then switched to executable with mprotect) needs the
      # allow-unsigned-executable-memory entitlement. PR runs skip this: the
      # build is what they exercise, and notarizing every PR would queue
      # Apple submissions for binaries nobody downloads.
      - name: Sign and notarize roc (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.MACOS_CI_KEYCHAIN_PWD }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER }}
        run: |
          set -euo pipefail
          bin=./roc-src/zig-out/bin/roc
          work="$RUNNER_TEMP/macos-signing"
          mkdir -p "$work"
          keychain="$work/signing.keychain-db"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$work/certificate.p12"
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PWD" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CI_KEYCHAIN_PWD" "$keychain" > /dev/null
          # codesign builds the certificate chain from the search list, so the
          # keychain holding the Developer ID intermediate has to be on it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$work/certificate.p12"

          cat > "$work/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --options runtime --timestamp \
            --entitlements "$work/entitlements.plist" \
            --keychain "$keychain" -s "$MACOS_CERTIFICATE_NAME" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -d --entitlements - "$bin"

          printf '%s' "$APPLE_NOTARIZATION_KEY" > "$work/notarization_key.p8"
          ditto -c -k --keepParent "$bin" "$work/roc.zip"
          result=$(xcrun notarytool submit "$work/roc.zip" \
            --key "$work/notarization_key.p8" \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER" \
            --wait --timeout 2h --output-format plist)
          rm "$work/notarization_key.p8"
          echo "$result"
          status=$(echo "$result" | plutil -extract status raw -o - -)
          if [ "$status" != "Accepted" ]; then
            id=$(echo "$result" | plutil -extract id raw -o - -)
            echo "::error::Notarization ended with status '$status' (submission $id)."
            exit 1
          fi

          security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v "$keychain")
          security delete-keychain "$keychain"

      - name: check if statically linked (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          $imports = (Get-Command roc-src\zig-out\bin\roc.exe).FileVersionInfo.ImportCharacterSet
          if ($imports) {
              echo "Looks like the nightly executable has dynamic dependencies. We want Roc to be super easy to install, so it should be statically linked."
              echo "Dynamic dependencies found:"
              $imports | ForEach-Object { echo "  $_" }
              exit 1
          }

      # Fail fast on a compiler that can't actually run a Roc program, before
      # spending time packaging and publishing it. Pins hello_world_test.roc's
      # roc: field to this nightly's tag so the smoke test exercises the exact
      # version string that will ship, and every matrix leg's binary has to
      # pass this before publish-release (which needs this job) can run.
      - name: Pin hello_world_test.roc to this nightly
        # TEMP disabled: hello_world_test.roc is headerless for now.
        if: false
        env:
          TAG: ${{ needs.resolve-roc-ref.outputs.tag }}
        run: |
          FILE=nightlies-repo/hello_world_test.roc
          PLATFORM_URL=$(grep -oE 'pf:[[:space:]]*platform[[:space:]]*"[^"]*"' "$FILE" | grep -oE '"[^"]*"' | tr -d '"')
          perl -0777 -pi -e "s|app \[main!\] \{.*?\}|app [main!] {\n\tpf: platform \"$PLATFORM_URL\",\n\troc: \"$TAG\",\n}|s" "$FILE"
          cat "$FILE"

      # Running the test program downloads the platform tarball from GitHub
      # releases, and that download flakes: 2026-09-15's macos_x86_64 leg died
      # on "── ✗ download failed ── ... Error: HttpError" and took the whole
      # nightly with it. The retry matches that signature only; roc's default
      # pattern is about Zig dependency fetches and does not cover it.
      #
      # Split by OS because flaky-retry runs `command` through bash on Unix and
      # `cmd /c` on Windows, which need different path spellings.
      - name: Run hello_world_test.roc (Unix)
        if: runner.os != 'Windows'
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: './roc-src/zig-out/bin/roc nightlies-repo/hello_world_test.roc'
          error_string_contains: 'download failed|Error: HttpError'
          retry_count: 3

      - name: Run hello_world_test.roc (Windows)
        if: runner.os == 'Windows'
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: 'roc-src\zig-out\bin\roc.exe nightlies-repo\hello_world_test.roc'
          error_string_contains: 'download failed|Error: HttpError'
          retry_count: 3

      - name: build file name
        run: echo "RELEASE_FOLDER_NAME=$ARCHIVE_PREFIX-${{ matrix.artifact_name }}-$ARCHIVE_VERSION$VARIANT_SUFFIX" >> $GITHUB_ENV

      - name: Package release
        run: |
          mkdir -p ${{ env.RELEASE_FOLDER_NAME }}
          cp ./roc-src/zig-out/bin/roc ${{ env.RELEASE_FOLDER_NAME }}/
          cp ./roc-src/LICENSE ./roc-src/legal_details ${{ env.RELEASE_FOLDER_NAME }}/

      - name: Bundle Darwin sysroot (macOS only)
        if: runner.os == 'macOS'
        run: |
          cp -r ./roc-src/src/cli/darwin ${{ env.RELEASE_FOLDER_NAME }}/

      - name: Compress release (Unix)
        if: runner.os != 'Windows'
        run: tar -czvf "${{ env.RELEASE_FOLDER_NAME }}.tar.gz" ${{ env.RELEASE_FOLDER_NAME }}

      - name: Compress release (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip "${{ env.RELEASE_FOLDER_NAME }}.zip" ${{ env.RELEASE_FOLDER_NAME }}

      - name: Calculate archive hash for security purposes (Unix)
        if: runner.os != 'Windows'
        run: sha256sum ${{ env.RELEASE_FOLDER_NAME }}.tar.gz

      - name: Calculate archive hash for security purposes (Windows)
        if: runner.os == 'Windows'
        run: sha256sum ${{ env.RELEASE_FOLDER_NAME }}.zip

      - name: Upload roc nightly archive (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FOLDER_NAME }}.tar.gz
          path: ${{ env.RELEASE_FOLDER_NAME }}.tar.gz
          retention-days: 4

      - name: Upload roc nightly archive (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_FOLDER_NAME }}.zip
          path: ${{ env.RELEASE_FOLDER_NAME }}.zip
          retention-days: 4

  build-wasm-artifacts:
    name: build compressed web wasm artifacts
    needs: resolve-roc-ref
    if: github.event_name == 'pull_request' || needs.resolve-roc-ref.outputs.already_released != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout roc-lang/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      # No Zig cache and a pinned flaky-retry, for the reasons given in
      # build-and-package.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Build playground wasm archive
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: 'cd roc-src && zig build build-playground-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload playground.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: playground.wasm.zst
          path: roc-src/zig-out/lib/playground/playground.wasm.zst
          if-no-files-found: error
          retention-days: 4

      - name: Build REPL wasm archive
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: 'cd roc-src && zig build build-repl-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload repl.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: repl.wasm.zst
          path: roc-src/zig-out/lib/repl/repl.wasm.zst
          if-no-files-found: error
          retention-days: 4

      - name: Build roc compiler wasm archive
        uses: roc-lang/roc/.github/actions/flaky-retry@1bf9043142a49a5290f7897af7a7e6f2c70a6615 # ratchet:exclude
        with:
          command: 'cd roc-src && zig build build-echo-wasm-archive -Doptimize=ReleaseSmall -Dcompiler-version=${{ needs.resolve-roc-ref.outputs.tag }}'
          error_string_contains: 'EndOfStream|build.zig.zon'
          retry_count: 3

      - name: Upload echo.wasm.zst
        uses: actions/upload-artifact@v4
        with:
          name: echo.wasm.zst
          path: roc-src/zig-out/lib/echo/echo.wasm.zst
          if-no-files-found: error
          retention-days: 4

  package-source:
    name: Package roc source code
    needs: resolve-roc-ref
    if: github.event_name == 'pull_request' || needs.resolve-roc-ref.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    env:
      ARCHIVE_PREFIX: ${{ needs.resolve-roc-ref.outputs.archive_prefix }}
      ARCHIVE_VERSION: ${{ needs.resolve-roc-ref.outputs.archive_version }}

    steps:
      # GitHub's own "Source code" assets on a nightly are the source of *this*
      # repo at the tag, which is just the workflow, not the compiler that was
      # built. Ship the roc-lang/roc tree at the exact commit these binaries
      # came from, so a release stays buildable even if that commit later
      # disappears from roc-lang/roc (force-push, rewritten history, deleted repo).
      # A versioned release in roc-lang/roc gets the same archives, so both
      # kinds of release carry the same set of assets.
      - name: Checkout roc-lang/roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve-roc-ref.outputs.sha_full }}
          path: roc-src

      - name: build file name
        run: echo "SOURCE_FOLDER_NAME=$ARCHIVE_PREFIX-source-$ARCHIVE_VERSION" >> $GITHUB_ENV

      - name: Prepare source folder
        run: |
          # .git here is a shallow, unusable-for-history checkout; dropping it
          # keeps the archive to the source that was actually compiled.
          rm -rf ./roc-src/.git
          mv ./roc-src "${{ env.SOURCE_FOLDER_NAME }}"
          # The folder name only carries the short sha, so record the full
          # commit the archive was cut from.
          echo "${{ needs.resolve-roc-ref.outputs.sha_full }}" > "${{ env.SOURCE_FOLDER_NAME }}/NIGHTLY_SOURCE_COMMIT"

      # Both formats, matching what GitHub attaches to a release itself:
      # tar.gz for unix, zip because Windows extracts it without extra tools.
      - name: Compress source (tar.gz)
        run: tar -czf "${{ env.SOURCE_FOLDER_NAME }}.tar.gz" "${{ env.SOURCE_FOLDER_NAME }}"

      - name: Compress source (zip)
        run: zip -r -q "${{ env.SOURCE_FOLDER_NAME }}.zip" "${{ env.SOURCE_FOLDER_NAME }}"

      - name: Calculate archive hashes for security purposes
        run: sha256sum "${{ env.SOURCE_FOLDER_NAME }}.tar.gz" "${{ env.SOURCE_FOLDER_NAME }}.zip"

      - name: Upload roc source archive (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_FOLDER_NAME }}.tar.gz
          path: ${{ env.SOURCE_FOLDER_NAME }}.tar.gz
          retention-days: 4

      - name: Upload roc source archive (zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SOURCE_FOLDER_NAME }}.zip
          path: ${{ env.SOURCE_FOLDER_NAME }}.zip
          retention-days: 4

  publish-release:
    name: Publish release to GitHub
    # One platform failing to build must not sink the whole nightly: the
    # archives that did build are still worth shipping, and a missing one is
    # better than nothing at all for that day. So instead of inheriting the
    # default "skip if any dependency failed", this job runs as long as the
    # run was not cancelled and resolve-roc-ref itself produced a tag; the
    # already_released guard the build jobs use has to be repeated here for
    # the same reason. Which archives actually exist is decided below, from
    # what was uploaded. The failed build leg still shows up red, so the run
    # as a whole is still reported as failed.
    if: >-
      ${{ !cancelled()
        && github.event_name != 'pull_request'
        && (github.event_name != 'workflow_dispatch' || inputs.publish)
        && needs.resolve-roc-ref.result == 'success'
        && needs.resolve-roc-ref.outputs.already_released != 'true' }}
    needs: [resolve-roc-ref, build-and-package, build-wasm-artifacts, package-source]
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.built.outputs.test_matrix }}
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve-roc-ref.outputs.sha }}
      TAG: ${{ needs.resolve-roc-ref.outputs.tag }}
      RELEASE_REPO: ${{ needs.resolve-roc-ref.outputs.release_repo }}
      PRERELEASE: ${{ needs.resolve-roc-ref.outputs.prerelease }}
      ARCHIVE_PREFIX: ${{ needs.resolve-roc-ref.outputs.archive_prefix }}
      VERSIONED: ${{ inputs.release_tag != '' }}

    steps:
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # ratchet:actions/download-artifact@v5.0.0
        with:
          path: ./artifacts

      # The ReleaseSafe archives ship as their own `<tag>-safe` release rather
      # than next to the regular ones: installers such as setup-roc pick a
      # release's archive by platform name alone, and would find two.
      - name: Set the safe archives apart
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir safe-artifacts
          for dir in artifacts/"$ARCHIVE_PREFIX"-*-safe.*; do
            mv "$dir" safe-artifacts/
          done

      # Because this job now runs even when a build leg failed, it has to work
      # out for itself which platforms made it into ./artifacts, warn about the
      # ones that did not, and refuse to publish a release with no binaries at
      # all. The list it produces also drives the smoke-test matrix below, so
      # those don't try to download an archive that was never released.
      - name: Determine which archives were built
        id: built
        run: |
          set -euo pipefail

          built=()
          built_safe=()
          for platform in macos_x86_64 macos_apple_silicon linux_x86_64 linux_arm64 windows_x86_64; do
            if compgen -G "artifacts/$ARCHIVE_PREFIX-$platform-*/*" > /dev/null; then
              built+=("$platform")
            else
              echo "::warning::No archive was built for $platform; it will be missing from $TAG."
            fi
            if compgen -G "safe-artifacts/$ARCHIVE_PREFIX-$platform-*/*" > /dev/null; then
              built_safe+=("$platform")
            else
              echo "::warning::No safe archive was built for $platform; it will be missing from $TAG-safe."
            fi
          done

          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::No platform archives were built, refusing to publish a release without binaries."
            exit 1
          fi
          echo "Publishing archives for: ${built[*]}"
          echo "Publishing safe archives for: ${built_safe[*]}"
          echo "safe_count=${#built_safe[@]}" >> "$GITHUB_OUTPUT"

          for extra in playground.wasm.zst repl.wasm.zst echo.wasm.zst "$ARCHIVE_PREFIX-source-*"; do
            compgen -G "artifacts/$extra/*" > /dev/null \
              || echo "::warning::$extra is missing from $TAG."
          done

          # Every OS the smoke tests cover, paired with the archive it needs,
          # once per variant. Legs whose archive is missing are dropped rather
          # than left to fail on a 404 download.
          #- {os: windows-11-arm, artifact_name: windows_arm64}
          matrix=$(jq -cn --arg fast "${built[*]}" --arg safe "${built_safe[*]}" '
            [
              {os: "macos-15-intel", artifact_name: "macos_x86_64"},
              {os: "macos-15",       artifact_name: "macos_apple_silicon"},
              {os: "macos-26-intel", artifact_name: "macos_x86_64"},
              {os: "macos-26",       artifact_name: "macos_apple_silicon"},
              {os: "ubuntu-22.04",   artifact_name: "linux_x86_64"},
              {os: "ubuntu-26.04",   artifact_name: "linux_x86_64"},
              {os: "ubuntu-26.04-arm", artifact_name: "linux_arm64"},
              {os: "windows-2022",   artifact_name: "windows_x86_64"},
              {os: "windows-2025",   artifact_name: "windows_x86_64"}
            ] as $legs
            | {fast: $fast, safe: $safe}
            | [to_entries[] | .key as $variant | (.value | split(" ")) as $built
                | $legs[] | select(.artifact_name as $a | $built | index($a))
                | . + {variant: $variant}]
            | {include: .}')
          echo "$matrix"
          echo "test_matrix=$matrix" >> "$GITHUB_OUTPUT"

      # A nightly is a full, "latest" release in this repo. A versioned
      # release goes into roc-lang/roc on the tag it was built from: this
      # workflow's GITHUB_TOKEN cannot write there, so it uses
      # ROC_RELEASE_TOKEN. It is never "latest" (that stays roc's previous
      # stable release until someone promotes it by hand), and is a prerelease
      # for an -RC tag. --verify-tag makes gh refuse rather than create the tag.
      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ inputs.release_tag != '' && secrets.ROC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SAFE_COUNT: ${{ steps.built.outputs.safe_count }}
        run: |
          if [ "$VERSIONED" = "true" ]; then
            BODY="Roc $TAG, built from roc-lang/roc commit [$SHA](https://github.com/roc-lang/roc/commit/$SHA).

          The \`$ARCHIVE_PREFIX-source-*\` archives contain the roc-lang/roc source these binaries were built from."
          else
            BODY="Nightly build of new Roc compiler from roc-lang/roc commit [$SHA](https://github.com/roc-lang/roc/commit/$SHA), the most recent commit on main that landed with a passing CI run.

          The \`$ARCHIVE_PREFIX-source-*\` archives contain the roc-lang/roc source these binaries were built from. GitHub's own \"Source code\" assets below are just this workflow repo."
          fi

          if [ "$SAFE_COUNT" != 0 ]; then
            BODY="$BODY

          A memory-safe (ReleaseSafe) build of this compiler, which protects against exploits from seemingly pure Roc code that tricks the compiler into emitting malicious effectful code, is in [$TAG-safe](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG-safe)."
          fi

          if [ "$VERSIONED" = "true" ]; then
            gh release create "$TAG" artifacts/**/* \
              -R "$RELEASE_REPO" \
              --verify-tag \
              --title "$TAG" \
              --notes "$BODY" \
              --prerelease="$PRERELEASE" \
              --latest=false
          else
            gh release create "$TAG" artifacts/**/* \
              -R "$RELEASE_REPO" \
              --title "$TAG" \
              --notes "$BODY" \
              --latest=true
          fi

      # After the regular release, so a failure here cannot cost the day its
      # regular nightly. Never "latest": whatever resolves the latest nightly
      # (setup-roc, `gh release view`) must keep getting the regular build.
      # Always published in this repo, so a versioned release's twin does not
      # create a `<tag>-safe` tag in roc-lang/roc.
      - name: Create safe release with gh CLI
        if: steps.built.outputs.safe_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$VERSIONED" = "true" ]; then KIND=release; else KIND=nightly; fi
          BODY="The compiler from [$TAG](https://github.com/$RELEASE_REPO/releases/tag/$TAG), built with Zig's ReleaseSafe mode instead of ReleaseFast. Safety checks such as bounds and integer overflow checks stay on. This protects against exploits: seemingly pure Roc code that tricks the compiler into emitting malicious effectful code. With the checks on, such a compiler bug panics instead of silently corrupting memory. It is slower than the regular $KIND.

          \`roc version\` reports \`$TAG\`, so apps pinned to that $KIND work with this build unchanged. The source archives are attached to [$TAG](https://github.com/$RELEASE_REPO/releases/tag/$TAG)."

          gh release create "$TAG-safe" safe-artifacts/*/* \
            -R "$GITHUB_REPOSITORY" \
            --title "$TAG-safe" \
            --notes "$BODY" \
            --prerelease="$PRERELEASE" \
            --latest=false

  test-archives:
    name: Test nightly release archives
    # A failed build leg does not just skip publish-release, it skips
    # everything downstream of it: the skip propagates through the whole
    # dependency graph, so opting publish-release out of it is not enough and
    # this job has to opt out too. What it needs is only that the release was
    # actually published; the matrix it gets from there already covers just
    # the archives that shipped.
    if: >-
      ${{ !cancelled()
        && github.event_name != 'pull_request'
        && needs.publish-release.result == 'success' }}
    needs: [resolve-roc-ref, publish-release]
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_PREFIX: ${{ needs.resolve-roc-ref.outputs.archive_prefix }}
      ARCHIVE_VERSION: ${{ needs.resolve-roc-ref.outputs.archive_version }}
      TAG: ${{ needs.resolve-roc-ref.outputs.tag }}
      VARIANT_SUFFIX: ${{ matrix.variant == 'safe' && '-safe' || '' }}
      # The safe twin is always in this repo; see publish-release.
      DOWNLOAD_REPO: ${{ matrix.variant == 'safe' && github.repository || needs.resolve-roc-ref.outputs.release_repo }}
    strategy:
      fail-fast: false
      # Built in publish-release, from the archives that actually shipped: a
      # platform that failed to build has no archive to smoke test, and a leg
      # for it would only fail on the download.
      matrix: ${{ fromJSON(needs.publish-release.outputs.test_matrix) }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: build file name
        run: echo "RELEASE_FOLDER_NAME=$ARCHIVE_PREFIX-${{ matrix.artifact_name }}-$ARCHIVE_VERSION$VARIANT_SUFFIX" >> $GITHUB_ENV

      - name: Download release archive (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.tar.gz" \
            "https://github.com/$DOWNLOAD_REPO/releases/download/$TAG$VARIANT_SUFFIX/${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Download release archive (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "${{ env.RELEASE_FOLDER_NAME }}.zip" \
            "https://github.com/$DOWNLOAD_REPO/releases/download/$TAG$VARIANT_SUFFIX/${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Print CPU model (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-WmiObject -Class Win32_Processor | Select-Object -ExpandProperty Name

      - name: Print CPU model (macOS)
        if: runner.os == 'macOS'
        run: sysctl -a | grep machdep.cpu.brand_string || true

      - name: Print CPU model (Linux)
        if: runner.os == 'Linux'
        run: lscpu | grep "Model name"

      - name: Decompress release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -xzf "${{ env.RELEASE_FOLDER_NAME }}.tar.gz"

      - name: Decompress release archive (Windows)
        if: runner.os == 'Windows'
        run: |
          7z x "${{ env.RELEASE_FOLDER_NAME }}.zip"

      - name: Checkout nightlies repo for hello_world_test.roc
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          path: nightlies-repo

      # The version is baked in by -Dcompiler-version at build time, so nothing
      # downstream can notice if that flag stops being passed and the binaries
      # silently go back to reporting "release-fast-<sha>". This is that check.
      # The safe build reports the regular tag too, not its own `-safe` one.
      - name: Check reported version matches the release tag
        run: |
          version_out="$(./${{ env.RELEASE_FOLDER_NAME }}/roc version)"
          echo "$version_out"
          expected="Roc compiler version $TAG"
          if [ "$version_out" != "$expected" ]; then
            echo "Expected '$expected' but got '$version_out'."
            exit 1
          fi

      - name: Run hello_world_test.roc (Unix)
        if: runner.os != 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc fmt nightlies-repo/hello_world_test.roc
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc

      - name: Run hello_world_test.roc (Windows)
        if: runner.os == 'Windows'
        run: |
          ./${{ env.RELEASE_FOLDER_NAME }}/roc fmt nightlies-repo/hello_world_test.roc
          ./${{ env.RELEASE_FOLDER_NAME }}/roc nightlies-repo/hello_world_test.roc

  pin-nightly:
    name: Pin hello_world_test.roc to the tested nightly
    # The pin claims the tag is good, so it waits for the proof: this runs only
    # once every smoke-test leg passed. test-archives has fail-fast disabled, so
    # its result is 'success' only when all of them did. The explicit result
    # checks are again there to opt out of a failed build leg's skip
    # propagating this far down the graph.
    # TEMP disabled: hello_world_test.roc is headerless for now.
    if: >-
      ${{ false
        && !cancelled()
        && github.event_name != 'pull_request'
        && needs.publish-release.result == 'success'
        && needs.test-archives.result == 'success' }}
    needs: [resolve-roc-ref, publish-release, test-archives]
    runs-on: ubuntu-latest
    permissions:
      # contents: write covers creating the PR's branch; opening and closing
      # the PR itself needs pull-requests: write.
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.resolve-roc-ref.outputs.tag }}

    steps:
      - name: Checkout nightlies repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      # Keep the repo's copy in sync with the tag that just shipped, so the
      # next run's smoke test (and anyone reading the repo) sees the version
      # actually verified to work.
      #
      # This cannot be a plain `git push` to main: main's ruleset requires
      # changes to arrive through a pull request *and* every commit to carry a
      # verified signature, and a push from the runner satisfies neither. So
      # the commit is made on a side branch through GraphQL
      # createCommitOnBranch, which GitHub signs with its own key, and a PR
      # proposes it.
      - name: Open a PR pinning hello_world_test.roc to this nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          FILE=hello_world_test.roc
          PLATFORM_URL=$(grep -oE 'pf:[[:space:]]*platform[[:space:]]*"[^"]*"' "$FILE" | grep -oE '"[^"]*"' | tr -d '"')
          perl -0777 -pi -e "s|app \[main!\] \{.*?\}|app [main!] {\n\tpf: platform \"$PLATFORM_URL\",\n\troc: \"$TAG\",\n}|s" "$FILE"
          cat "$FILE"

          if git diff --quiet -- "$FILE"; then
            echo "$FILE is already pinned to $TAG"
            exit 0
          fi

          # One branch per tag, so a rerun of the same nightly reuses its
          # branch instead of piling up near-identical ones.
          PR_BRANCH="pin-hello-world-test/$TAG"

          # Yesterday's PR is obsolete the moment this one exists: both edit
          # the same two lines, and only the newest pin is worth merging.
          # Closing them keeps the queue at one open PR.
          for old in $(gh pr list --state open --json number,headRefName \
                --jq ".[] | select(.headRefName | startswith(\"pin-hello-world-test/\") and . != \"$PR_BRANCH\") | .number"); do
            echo "Closing superseded pin PR #$old"
            gh pr close "$old" --delete-branch --comment "Superseded by the pin for $TAG." || true
          done

          # Branch off main's current tip rather than this run's checkout, so
          # the PR stays mergeable if main moved while the build ran.
          BASE_OID=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" --jq .object.sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" >/dev/null 2>&1; then
            HEAD_OID=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" --jq .object.sha)
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$PR_BRANCH" -f sha="$BASE_OID" >/dev/null
            HEAD_OID="$BASE_OID"
          fi

          # createCommitOnBranch takes whole-file contents, base64 encoded, so
          # there is no merge to do and no signature for us to produce: GitHub
          # writes and signs the commit itself.
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$PR_BRANCH" \
            --arg oid "$HEAD_OID" \
            --arg msg "Pin hello_world_test.roc to $TAG" \
            --arg path "$FILE" \
            --arg contents "$(base64 -w0 "$FILE")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $msg},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: $path, contents: $contents}]}
              }}
            }' > commit-payload.json
          gh api graphql --input commit-payload.json

          if [ -n "$(gh pr list --state open --head "$PR_BRANCH" --json number --jq '.[].number')" ]; then
            echo "PR for $PR_BRANCH already open"
            exit 0
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$PR_BRANCH" \
            --title "Pin hello_world_test.roc to $TAG" \
            --body "Automated: [\`$TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) was published and its smoke test passed on every OS it was built for, so this pins \`hello_world_test.roc\` to it."

          # Best effort: auto-merge only exists if the repo has it enabled, and
          # the pin is cosmetic enough that failing this job over it would be
          # the wrong trade.
          gh pr merge "$PR_BRANCH" --squash --auto --delete-branch \
            || echo "::notice::Could not enable auto-merge on the pin PR; merge it by hand."
